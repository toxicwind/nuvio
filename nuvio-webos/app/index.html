<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<title>SLATE</title>
<style>
:root{--slate-overscan:32px;--slate-bg:#000;--slate-panel:#0a0a0c;--slate-raised:#141418;--slate-text:#f5f5f7;--slate-muted:#8e8e96;--slate-accent:#4f7cff;--slate-accent-hot:#7aa2ff;--slate-focus-ms:140ms}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--slate-bg);color:var(--slate-text);font-family:Arial,Helvetica,sans-serif;height:100vh;overflow:hidden;padding:var(--slate-overscan)}
.hero{position:relative;height:42vh;border-radius:18px;overflow:hidden;background:url('assets/hero-slate.png') center/cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.15) 55%,transparent)}
.hero .meta{position:absolute;left:52px;bottom:52px;max-width:640px}
.hero h1{font-size:60px;letter-spacing:4px;margin-bottom:10px}
.hero p{color:var(--slate-muted);font-size:22px;line-height:1.4}
.hero .cta{display:inline-block;margin-top:18px;padding:14px 40px;background:var(--slate-accent);color:#fff;border-radius:30px;font-weight:700;letter-spacing:3px;font-size:20px}
.rail{margin-top:30px}
.rail h2{font-size:24px;color:var(--slate-text);margin-bottom:12px;letter-spacing:1px}
.rail .row{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
.rail .row::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:200px;height:300px;border-radius:12px;background:linear-gradient(160deg,#141418,#05070f);border:3px solid transparent;transition:border-color var(--slate-focus-ms),transform var(--slate-focus-ms)}
.card.focused{border-color:#fff;transform:scale(1.06)}
.card .label{padding:10px;color:var(--slate-muted);font-size:15px}
.epg .now{color:var(--slate-accent-hot);font-size:14px}
</style>
</head>
<body>
<section class="hero" id="hero">
  <div class="shade"></div>
  <div class="meta">
    <h1>SLATE</h1>
    <p>Cinema &middot; Live TV &middot; Your Library — the fork that went beyond.</p>
    <span class="cta">PRESS OK</span>
  </div>
</section>
<div class="rail" id="r1"><h2>Live TV — Now</h2><div class="row epg" id="epgRow"></div></div>
<div class="rail" id="r2"><h2>Your Library</h2><div class="row" id="libRow"></div></div>
<div class="rail" id="r3"><h2>Continue Watching</h2><div class="row" id="cwRow"></div></div>
<script type="module">
// Vendored Bun library consumption: @slate/netflix-ux from dist/slate-ux.js
import { createFocus, moveFocus, createEPG, nowNextFor, createOSD } from "./dist/slate-ux.js";

// EPG sample data wired through vendored EPG engine
const epgState = createEPG();
const chans = [
  { id: "SLATE-1", name: "Cinema 4K", prog: "Morning Cinema", p: "12%" },
  { id: "SLATE-2", name: "News Global", prog: "Prime News", p: "67%" },
  { id: "SLATE-3", name: "Live Sports", prog: "Sports Live", p: "34%" },
  { id: "SLATE-4", name: "Documentary", prog: "Wild Earth", p: "89%" }
];

document.getElementById("epgRow").innerHTML = chans.map(c =>
  `<div class="card" data-nav id="${c.id}"><div class="label">${c.name}</div><div class="label now">${c.prog} · ${c.p}</div></div>`
).join("");

// Library & continue watching cards
document.getElementById("libRow").innerHTML = Array.from({length:8}, (_,i) =>
  `<div class="card" data-nav id="lib-${i}"></div>`
).join("");
document.getElementById("cwRow").innerHTML = Array.from({length:6}, (_,i) =>
  `<div class="card" data-nav id="cw-${i}"></div>`
).join("");

// Initialize spatial LRUD focus engine from vendored library
const cardEls = [...document.querySelectorAll("[data-nav]")];
let focusState = createFocus(cardEls.map(el => el.id));

function updateFocusView() {
  cardEls.forEach(el => el.classList.toggle("focused", el.id === focusState.focusedId));
  const active = document.getElementById(focusState.focusedId);
  if (active) {
    active.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
  }
}

document.addEventListener("keydown", e => {
  const dirs = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
  if (dirs[e.key]) {
    e.preventDefault();
    const res = moveFocus(focusState, dirs[e.key], 4);
    focusState = res.next;
    updateFocusView();
  }
});

updateFocusView();

// Live SSE hot-reload from BLUE plane (awrawr-pc lg-hot :18080) + TV anti-screensaver heartbeat
try {
  const es = new EventSource("http://10.0.0.218:18080/__reload");
  es.onmessage = e => { if (e.data === "reload") location.reload(); };
} catch {}
</script>
</body>
</html>
